<!doctype html>
<html><head><meta charset="utf-8"><title>Neon Snake</title><link rel="stylesheet" href="app.css"></head>
<body>
<div class="stage">
  <div class="hud"><div><span>SCORE</span><b id="score">0</b></div><div><span>BEST</span><b id="best">0</b></div></div>
  <canvas id="c" width="720" height="480"></canvas>
  <div class="help">Arrows / WASD / D-pad to steer · P or Start to pause · F1 or Home button for Home</div>
</div>
<div class="overlay" id="ov"><h1 id="ovT">NEON SNAKE</h1><p id="ovP">Press Enter or A to start</p></div>
<script src="sdk.js"></script>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const S = 24, W = c.width / S, H = c.height / S;
let snake, dir, nextDir, food, score, best = Nova.load('snake.best', 0), state = 'menu', acc = 0, speed, last = 0;
document.getElementById('best').textContent = best;

function reset() {
  snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = nextDir = { x: 1, y: 0 }; score = 0; speed = 8; placeFood();
  document.getElementById('score').textContent = 0;
}
function placeFood() {
  do food = { x: Math.floor(Math.random() * W), y: Math.floor(Math.random() * H) };
  while (snake.some((s) => s.x === food.x && s.y === food.y));
}
function overlay(t, p) { document.getElementById('ov').classList.toggle('hidden', !t); if (t) { ovT.textContent = t; ovP.textContent = p; } }

function step() {
  dir = nextDir;
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (h.x < 0 || h.y < 0 || h.x >= W || h.y >= H || snake.some((s) => s.x === h.x && s.y === h.y)) {
    state = 'over'; Nova.beep(110, 0.4, 'sawtooth');
    if (score > best) { best = score; Nova.save('snake.best', best); document.getElementById('best').textContent = best; Nova.toast('🐍 New high score: ' + best); }
    return overlay('GAME OVER', `Score ${score} · Press Enter or A to play again`);
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score += 10; speed = Math.min(20, speed + 0.4); placeFood(); Nova.beep(880, 0.07);
    document.getElementById('score').textContent = score;
  } else snake.pop();
}

function draw(t) {
  x.fillStyle = '#0a0b16'; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = 'rgba(255,255,255,.03)';
  for (let i = 0; i <= W; i++) { x.beginPath(); x.moveTo(i * S, 0); x.lineTo(i * S, c.height); x.stroke(); }
  for (let j = 0; j <= H; j++) { x.beginPath(); x.moveTo(0, j * S); x.lineTo(c.width, j * S); x.stroke(); }
  const pulse = 4 + Math.sin(t / 150) * 2;
  x.shadowBlur = 20; x.shadowColor = '#ff3df2'; x.fillStyle = '#ff3df2';
  x.beginPath(); x.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - pulse / 2, 0, 7); x.fill();
  x.shadowColor = '#00ffa8';
  snake.forEach((s, i) => {
    x.fillStyle = `hsl(${155 - i * 2}, 100%, ${60 - Math.min(i, 25)}%)`;
    x.fillRect(s.x * S + 2, s.y * S + 2, S - 4, S - 4);
  });
  x.shadowBlur = 0;
}

function loop(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  Nova.poll();
  const want = Nova.tap('up') ? { x: 0, y: -1 } : Nova.tap('down') ? { x: 0, y: 1 } : Nova.tap('left') ? { x: -1, y: 0 } : Nova.tap('right') ? { x: 1, y: 0 } : null;
  if (state === 'play') {
    if (want && (want.x !== -dir.x || want.y !== -dir.y)) nextDir = want;
    if (Nova.tap('start') && !Nova.tap('a') || Nova.tap('b')) { state = 'pause'; overlay('PAUSED', 'Press Enter or A to keep going'); }
    acc += dt;
    while (state === 'play' && acc > 1 / speed) { acc -= 1 / speed; step(); }
  } else if (Nova.tap('a') || Nova.tap('start')) {
    if (state !== 'pause') reset();
    state = 'play'; acc = 0; overlay();
  }
  draw(t);
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
</body></html>
